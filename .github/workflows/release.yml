name: check

# 发布镜像在实际部署主机上原生构建，只生成该主机的平台。
# GitHub Actions 只做可重复的代码质量检查，不再构建 Release 二进制或多平台容器。
on:
  push:
    branches: [master]
    tags:
      - 'v*'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy rustfmt
      - name: Format check
        run: cargo fmt --check
      - name: Test
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
