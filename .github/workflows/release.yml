name: check

# 发布镜像在实际部署主机上原生构建，只生成该主机的平台。
# GitHub Actions 只做可重复的代码质量检查，不再构建 Release 二进制或多平台容器；
# 推送 v* tag 且检查通过后，用 CHANGELOG 里对应版本的一节建 GitHub Release（不附产物）。
on:
  push:
    branches: [master]
    tags:
      - 'v*'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy rustfmt
      # jpegtran/djpeg let the strip-join tests cover the lossless JPEG path.
      - run: sudo apt-get install -y --no-install-recommends libjpeg-turbo-progs
      - name: Format check
        run: cargo fmt --check
      - name: Test
        run: cargo test --all-targets
      - name: Check Python bridge
        run: |
          command -v openssl
          python3 -m venv "$RUNNER_TEMP/hanabi-python-check"
          "$RUNNER_TEMP/hanabi-python-check/bin/python" -m pip install 'aiohttp>=3.9,<4'
          "$RUNNER_TEMP/hanabi-python-check/bin/python" -m unittest discover -s tests -p 'test_*.py'
          "$RUNNER_TEMP/hanabi-python-check/bin/python" -m py_compile tools/douyin_user_feed.py
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="${TAG#v}" '/^## \[/ { f = index($0, "## [" v "]") == 1; next } f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for ${TAG#v}"
            exit 1
          fi
          gh release create "$TAG" --verify-tag --title "Hanabi $TAG" --notes-file "$RUNNER_TEMP/notes.md"
